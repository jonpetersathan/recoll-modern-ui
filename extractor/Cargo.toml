[package]
name = "recoll-metadata-extractor"
version = "0.1.0"
edition = "2021"
authors = ["Recoll Modern UI Contributors"]
description = "High-performance metadata extractor for Recoll indexing"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
regex = "1.10"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
