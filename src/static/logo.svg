<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Brand Gradient: Pink -> Purple -> Blue -->
    <linearGradient id="recollGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#38bdf8" />
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="accentGrad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield / Squircle -->
  <rect x="4" y="4" width="56" height="56" rx="16" fill="#151a30" stroke="url(#recollGrad)" stroke-width="2" />

  <!-- Document Stack Layers -->
  <rect x="16" y="14" width="26" height="32" rx="4" fill="rgba(168, 85, 247, 0.15)" stroke="rgba(244, 114, 182, 0.4)" stroke-width="1.5" />
  <rect x="20" y="18" width="26" height="32" rx="4" fill="rgba(56, 189, 248, 0.2)" stroke="url(#recollGrad)" stroke-width="1.8" />

  <!-- Stylized Document Lines inside -->
  <line x1="26" y1="26" x2="40" y2="26" stroke="#f3f4f6" stroke-width="2" stroke-linecap="round" opacity="0.9" />
  <line x1="26" y1="32" x2="36" y2="32" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />
  <line x1="26" y1="38" x2="32" y2="38" stroke="#9ca3af" stroke-width="1.8" stroke-linecap="round" opacity="0.8" />

  <!-- Search Lens Overlay with Glow -->
  <g filter="url(#glow)">
    <circle cx="38" cy="38" r="13" fill="rgba(15, 19, 34, 0.75)" stroke="url(#recollGrad)" stroke-width="2.5" />
    <path d="M47.5 47.5L56 56" stroke="url(#recollGrad)" stroke-width="3.5" stroke-linecap="round" />
    <!-- Lens Reflection Sparkle -->
    <path d="M33 33 A 8 8 0 0 1 43 33" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" fill="none" opacity="0.85" />
    <circle cx="43" cy="33" r="1.5" fill="#f472b6" />
  </g>
</svg>
